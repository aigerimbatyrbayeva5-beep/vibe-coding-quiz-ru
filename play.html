<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2b1a6b">
<title>Пульт · Ракетная гонка</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#2b1a6b,#0b6e8a);min-height:100%;display:flex;flex-direction:column;user-select:none}
.view{display:none;flex:1;flex-direction:column;padding:20px 16px;gap:14px}
.view.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1{font-size:26px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.sub{opacity:.85;font-size:16px}
input{font:inherit;font-size:22px;font-weight:700;padding:14px 16px;border-radius:16px;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.95);color:#1b1b2f;width:100%;text-transform:none}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{font:inherit;color:#fff;font-size:20px;font-weight:900;border:3px solid transparent;border-radius:18px;padding:18px 8px;cursor:pointer;
 background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.team.sel{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.3);transform:scale(1.03)}
.go{font:inherit;font-size:22px;font-weight:900;color:#1b1b2f;background:linear-gradient(180deg,#fff3a8,#ffd23f);border:0;border-radius:18px;padding:16px;box-shadow:0 6px 0 #c49400;cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #c49400}
.go:disabled{opacity:.5}
.bar{display:flex;justify-content:space-between;font-weight:800;font-size:15px;opacity:.9}
.pad{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.k{font:inherit;color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:22px;font-size:44px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
 background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.05) 50%,rgba(0,0,0,.12));box-shadow:0 8px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.6);text-shadow:0 2px 0 rgba(0,0,0,.3);min-height:120px}
.k small{font-size:18px;margin-top:4px}
.k:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.c0{background-color:#e63946}.c1{background-color:#1d72d8}.c2{background-color:#f4a300}.c3{background-color:#2a9d4b}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.emoji{font-size:84px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.card{background:rgba(255,255,255,.95);color:#1b1b2f;border-radius:18px;padding:14px 16px;font-size:17px;line-height:1.45;text-align:left;width:100%}
.res{font-size:34px;font-weight:900}
.err{background:#e63946;border-radius:14px;padding:10px 14px;font-weight:700;display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>

<section class="view on" id="vJoin">
 <h1>🚀 Ракетная гонка</h1>
 <div class="sub">Ваш телефон станет пультом. Вопросы — на доске.</div>
 <div id="roomBox"><div class="sub" style="margin-bottom:6px">Код комнаты</div><input id="room" maxlength="4" placeholder="Например, K7QX" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em"></div>
 <div><div class="sub" style="margin-bottom:6px">Ваше имя или ник</div><input id="name" maxlength="16" placeholder="Например, Айгерим" autocomplete="off"></div>
 <div class="sub">Выберите команду</div>
 <div class="teams" id="teams"></div>
 <div class="err" id="err"></div>
 <button class="go" id="joinBtn">Войти в игру</button>
</section>

<section class="view" id="vWait">
 <div class="big"><div class="emoji" id="waitEmoji">🦉</div><h1 id="waitTitle">Вы в игре!</h1><div class="sub" id="waitText">Смотрите на доску — скоро начнём.</div></div>
</section>

<section class="view" id="vQ">
 <div class="bar"><span id="qn">Вопрос 1</span><span id="me">🦉</span></div>
 <div class="sub" style="text-align:center">Выберите ответ, который на доске</div>
 <div class="pad" id="pad"></div>
</section>

<section class="view" id="vRes">
 <div class="big"><div class="res" id="resTitle"></div><div class="card" id="resCard"></div><div class="sub" id="resScore"></div><div class="sub">Следующий вопрос — на доске</div></div>
</section>

<section class="view" id="vEnd">
 <div class="big"><div class="emoji">🌕</div><h1 id="endTitle"></h1><div class="card" id="endCard"></div><div class="sub">Спасибо за игру!</div></div>
</section>

<script>
const TEAMS=[{name:'Совы',emoji:'🦉',color:'#7b61ff'},{name:'Лисы',emoji:'🦊',color:'#e8590c'},{name:'Кометы',emoji:'☄️',color:'#1d72d8'},{name:'Тигры',emoji:'🐯',color:'#2a9d4b'}];
const SH=['▲','◆','●','■'], L=['A','B','C','D'];
const $=id=>document.getElementById(id);
let team=-1, client=null, me=null, joinTimer=null, joined=false;
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
let pid; try{ pid=sessionStorage.getItem('rr-pid') }catch(e){}
if(!pid){ pid=Math.random().toString(36).slice(2,10); try{ sessionStorage.setItem('rr-pid',pid) }catch(e){} }
const params=new URLSearchParams(location.search);
if(params.get('room')){ $('room').value=params.get('room').toUpperCase(); $('roomBox').style.display='none'; }
try{ $('name').value=localStorage.getItem('rr-name')||'' }catch(e){}

$('teams').innerHTML=TEAMS.map((t,i)=>`<button class="team" data-i="${i}" style="background-color:${t.color}">${t.emoji}<br>${t.name}</button>`).join('');
$('teams').onclick=e=>{ const b=e.target.closest('.team'); if(!b) return; team=+b.dataset.i; document.querySelectorAll('.team').forEach(x=>x.classList.toggle('sel',x===b)); };
$('pad').innerHTML=L.map((l,i)=>`<button class="k c${i}" data-c="${i}">${SH[i]}<small>${l}</small></button>`).join('');
$('pad').onclick=e=>{ const b=e.target.closest('.k'); if(!b||!client) return; if(navigator.vibrate) navigator.vibrate(30); up({type:'answer',choice:+b.dataset.c}); show('vWait'); waitMsg('🔒','Ответ принят!','Ждём остальных…'); };

function show(id){ document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id)) }
function err(t){ $('err').textContent=t; $('err').style.display=t?'block':'none' }
function waitMsg(e,t,s){ $('waitEmoji').textContent=e; $('waitTitle').textContent=t; $('waitText').textContent=s }

$('joinBtn').onclick=join;
function join(){
 const room=$('room').value.trim().toUpperCase(), name=$('name').value.trim();
 if(room.length!==4) return err('Введите код комнаты из 4 символов.');
 if(!name) return err('Введите имя или ник.');
 if(team<0) return err('Выберите команду.');
 if(!window.mqtt) return err('Нет интернета на телефоне. Включите Wi-Fi или мобильный интернет.');
 try{ localStorage.setItem('rr-name',name) }catch(e){}
 err(''); $('joinBtn').disabled=true; $('joinBtn').textContent='Подключаемся…';
 me={room,name,team};
 connect();
}
function topic(t){ return 'agis-vibequiz/'+me.room+'/'+t }
function up(m){ m.pid=pid; try{ client.publish(topic('up'),JSON.stringify(m),{qos:1}) }catch(e){} }
function connect(){
 if(client) try{ client.end(true) }catch(e){}
 const b=+(params.get('b')||0);
 client=mqtt.connect(BROKERS[b]||BROKERS[0],{connectTimeout:8000,reconnectPeriod:2000,clean:true});
 client.on('connect',()=>{
  client.subscribe(topic('down/'+pid),{qos:1},()=>{
   up({type:'join',name:me.name,team:me.team});
   clearTimeout(joinTimer);
   joinTimer=setTimeout(()=>{ if(!joined) fail('Комната '+me.room+' не отвечает. Проверьте код на доске и что доска открыта.') },8000);
  });
 });
 client.on('message',(t,buf)=>{ let m; try{ m=JSON.parse(buf.toString()) }catch(e){ return } onData(m) });
 client.on('reconnect',()=>{ if(joined){ show('vWait'); waitMsg('📡','Переподключение…','Связь прервалась, пробуем снова.') } });
 client.on('error',()=>{});
 setTimeout(()=>{ if(!client.connected && !joined) fail('Нет связи. Включите мобильный интернет или другой Wi-Fi и попробуйте ещё раз.') },10000);
}
function fail(t){ joined=false; try{ client&&client.end(true) }catch(e){} show('vJoin'); err(t); $('joinBtn').disabled=false; $('joinBtn').textContent='Войти в игру' }

function onData(m){
 const t=TEAMS[me.team];
 if(m.type==='joined'){ joined=true; clearTimeout(joinTimer); $('me').textContent=t.emoji+' '+m.name; show('vWait'); waitMsg(t.emoji,'Вы в игре!','Команда «'+t.name+'». Смотрите на доску — скоро начнём.'); }
 if(m.type==='wait'){ show('vWait'); waitMsg(t.emoji,'Вы в игре!',m.text); }
 if(m.type==='question'){ $('qn').textContent=`Вопрос ${m.n} / ${m.total}`; show('vQ'); }
 if(m.type==='locked'){ show('vWait'); waitMsg('🔒','Ответ принят!','Ждём остальных…'); }
 if(m.type==='result'){
  $('resTitle').textContent=!m.answered?'⏱ Время вышло':(m.ok?'✅ Верно!':'❌ Неверно');
  $('resTitle').style.color=m.ok?'#7CFC9A':'#ffd23f';
  $('resCard').innerHTML='<b>Правильный ответ:</b> '+esc(m.correct)+'<br><br>💡 '+esc(m.why);
  $('resScore').textContent=`Ваши верные ответы: ${m.score} из ${m.n}`;
  if(m.ok&&navigator.vibrate) navigator.vibrate([40,40,40]);
  show('vRes');
 }
 if(m.type==='end'){
  $('endTitle').textContent=`${m.team.emoji} ${m.team.name}: ${m.place} место`;
  $('endCard').innerHTML=`Ваши верные ответы: <b>${m.score} из ${m.total}</b><br>Результат виден только вам.`;
  show('vEnd');
 }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
</body>
</html>
